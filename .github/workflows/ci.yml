name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Pruebas y cobertura (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pruebas unitarias
        run: pytest tests/unit -v -m unit

      - name: Pruebas de integración
        run: pytest tests/integration -v -m integration

      - name: Cobertura (división por cero y divisas no soportadas)
        run: |
          pytest --cov=conversor --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
